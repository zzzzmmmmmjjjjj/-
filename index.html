  <body>
    <canvas id="scene" aria-label="高清缓放的三维牡丹"></canvas>

    <header class="intro">
      <p class="eyebrow">A FLOWER UNFOLDING</p>
      <h1>朝暮与卿</h1>
      <p class="subtitle">花开未央 · 此心不渝</p>
    </header>

    <button class="bloom" type="button" aria-label="重新播放花朵开放">
      <span></span>
      <span class="bloom-label">轻触开启</span>
    </button>

    <button class="music" type="button" aria-label="播放背景音乐" aria-pressed="false">
      <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="music-copy"><strong>The Rose</strong><small>手嶌葵</small></span>
    </button>

    <p class="hint hidden">单指旋转 · 双指缩放</p>

    <button class="start-gate" type="button">
      <span class="start-gate-ring" aria-hidden="true"></span>
      <strong>轻触屏幕，花开</strong>
      <small class="start-gate-note">添加到主屏幕，桌面随时赏 3D 牡丹</small>
    </button>

    <div class="install-banner hidden" id="install-banner">
      <div class="install-banner-copy">
        <strong>添加到主屏幕</strong>
        <span>桌面一键打开 3D 缓放牡丹</span>
      </div>
      <button type="button" id="install-btn">添加</button>
      <button type="button" class="install-close" aria-label="关闭">×</button>
    </div>

    <div class="install-guide hidden" id="install-guide">
      <div class="install-guide-card">
        <h2>添加到主屏幕</h2>
        <p class="install-guide-ios">iPhone：Safari 底部 <strong>分享</strong> → <strong>添加到主屏幕</strong></p>
        <p class="install-guide-android">Android：Chrome 菜单 <strong>⋮</strong> → <strong>添加到主屏幕</strong></p>
        <button type="button" class="install-guide-close">知道了</button>
      </div>
    </div>

    <audio id="background-music" loop playsinline webkit-playsinline preload="metadata"></audio>

    <div class="loading" role="status">
      <span></span>
      <p>正在绘制花瓣</p>
    </div>

  </body>
